<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shitflix — Watch Movies & TV Shows Online</title>
  <meta name="description" content="Shitflix is the ultimate streaming platform. Watch unlimited movies and TV shows. Binge-worthy content, anytime, anywhere." />
  <meta name="theme-color" content="#141414" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/shitflix-logo.png" />
</head>
<body>
  <div id="app">
    <div id="sf-loading-screen" class="sf-loading-screen">
      <div class="sf-loading-logo">
        <img src="/shitflix-logo.png" alt="Shitflix" style="height: 60px; object-fit: contain; mix-blend-mode: screen;" />
      </div>
      <div class="sf-loading-bar">
        <div class="sf-loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Detail Modal Portal -->
  <div id="sf-modal-root"></div>

  <!-- Notification Toast Portal -->
  <div id="sf-toast-root"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
