services:
  - type: web
    name: shitflix-backend
    env: node
    rootDir: backend/telegram-streamer
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
